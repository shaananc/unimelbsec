---
layout: default
---
<section class="section page-section">
  <div class="shell shell--narrow">
    {% unless page.hide_page_heading %}
      <div class="section-heading">
        <p class="eyebrow">Archive</p>
        <h1>{{ page.title }}</h1>
        {% if page.description %}
          <p>{{ page.description }}</p>
        {% endif %}
      </div>
    {% endunless %}
    {{ content }}
  </div>
</section>
