<dialog class="person-modal" id="person-modal" aria-labelledby="person-modal-title">
  <form class="person-modal__frame" method="dialog">
    <button class="person-modal__close" type="submit" aria-label="Close profile">Close</button>
    <div class="person-modal__layout">
      <img class="person-modal__image" src="" alt="" hidden>
      <div class="person-modal__copy">
        <p class="eyebrow person-modal__eyebrow" id="person-modal-role"></p>
        <h2 id="person-modal-title"></h2>
        <div class="person-modal__summary" id="person-modal-summary"></div>
        <div class="person-modal__actions" id="person-modal-actions"></div>
      </div>
    </div>
  </form>
</dialog>

<script>
  (() => {
    const modal = document.getElementById("person-modal");
    if (!modal) return;

    const title = document.getElementById("person-modal-title");
    const role = document.getElementById("person-modal-role");
    const image = modal.querySelector(".person-modal__image");
    const summary = document.getElementById("person-modal-summary");
    const actions = document.getElementById("person-modal-actions");
    let activeKey = "";

    const openPersonModal = (trigger) => {
      title.textContent = trigger.dataset.personName || "";
      role.textContent = trigger.dataset.personRole || "";
      activeKey = trigger.dataset.personKey || "";

      if (trigger.dataset.personImage) {
        image.src = trigger.dataset.personImage;
        image.alt = trigger.dataset.personAlt || "";
        image.hidden = false;
      } else {
        image.hidden = true;
        image.removeAttribute("src");
        image.alt = "";
      }

      const sourceSummary = trigger.parentElement.querySelector("[data-person-modal-content]");
      summary.innerHTML = sourceSummary ? sourceSummary.innerHTML : "";
      actions.innerHTML = "";

      if (trigger.dataset.personProfileUrl) {
        const profileLink = document.createElement("a");
        profileLink.className = "button-link";
        profileLink.href = trigger.dataset.personProfileUrl;
        profileLink.textContent = "Visit website";
        actions.appendChild(profileLink);
      }

      if (trigger.dataset.personEmail) {
        const emailLink = document.createElement("a");
        emailLink.className = "text-link";
        emailLink.href = `mailto:${trigger.dataset.personEmail}`;
        emailLink.textContent = trigger.dataset.personEmail;
        actions.appendChild(emailLink);
      }

      modal.showModal();
      if (activeKey) {
        history.replaceState(null, "", `#person:${activeKey}`);
      }
    };

    document.querySelectorAll("[data-person-modal-open]").forEach((trigger) => {
      trigger.addEventListener("click", () => openPersonModal(trigger));
    });

    modal.addEventListener("click", (event) => {
      const rect = modal.getBoundingClientRect();
      const inside =
        event.clientX >= rect.left &&
        event.clientX <= rect.right &&
        event.clientY >= rect.top &&
        event.clientY <= rect.bottom;
      if (!inside) modal.close();
    });

    modal.addEventListener("close", () => {
      if (location.hash.startsWith("#person:")) {
        history.replaceState(null, "", location.pathname + location.search);
      }
      activeKey = "";
    });

    if (location.hash.startsWith("#person:")) {
      const key = location.hash.slice("#person:".length);
      const trigger = document.querySelector(`[data-person-key="${key}"]`);
      if (trigger) openPersonModal(trigger);
    }
  })();
</script>
